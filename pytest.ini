[pytest]
testpaths = tests
addopts =
    --ignore=tests/integration
    --deselect=tests/test_architecture_boundaries.py::test_invariant_descriptor_catalog_is_production_owned_not_duplicated_in_diagnostics
    --deselect=tests/test_candidate_band.py::test_ported_band_matches_original_including_claim_excluded_from_count
    --deselect=tests/test_matching_pairs_store.py::test_write_freeze_snapshot_contains_true_pair_with_existing_mask
    --deselect=tests/test_matching_pairs_store.py::test_sync_matching_pairs_cli_main
    --deselect=tests/test_qupath_runtime.py::test_block_qupath_backend_loads_the_saved_classifier
    --deselect=tests/test_qupath_runtime.py::test_native_qupath_import_rejects_non_identity_feature_normalization
markers =
    native_resolution: keep CAPTURE_DIMENSIONS["block"] at the native sensor size
